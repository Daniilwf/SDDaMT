name: Build and Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Update Ubuntu
        run: sudo apt update && sudo apt upgrade -y

      - name: Install apps
        run: sudo apt install build-essential git dpkg-dev devscripts lintian

      - name: Starting build
        run: ./scripts/build.sh

      - name: Running tests
        run: ./scripts/test.sh

      - name: Building a deb package
        run: ./scripts/package.sh
